<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Edition labels</title>
    <style>
        :root { color-scheme: light dark; }
        @font-face { font-family: Keyrune; src: url(lib/keyrune/keyrune.woff2) format('woff2'); }
        @font-face { font-family: Cinzel; font-weight: 700; src: url(lib/cinzel/cinzel-bold-latin.woff2) format('woff2'); }
        body { font: 14px system-ui, sans-serif; max-width: 960px; margin: 24px auto; padding: 0 16px; }
        h1 { font-size: 20px; }
        .card { border: 1px solid GrayText; border-radius: 6px; padding: 12px; margin: 12px 0; }
        .card h2 { font-size: 15px; margin: 0 0 8px; }
        .card canvas { display: block; max-width: 100%; margin-bottom: 8px; background: #fff; }
        #error { color: crimson; }
    </style>
</head>
<body>
    <h1>Edition labels</h1>
    <p id="empty" hidden>No sets selected. Add codes to the address, for example #sets=ons</p>
    <p id="error" hidden></p>
    <div id="cards"></div>
    <script src="core.js"></script>
    <script src="keyrune-map.js"></script>
    <script src="labels.js"></script>
</body>
</html>
